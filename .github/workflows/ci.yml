name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hwmon-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hwmon
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml in hwmon/ pins the channel; rustup reads it from cwd.
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hwmon

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Smoke --once
        run: cargo run --locked -- --once --no-log
